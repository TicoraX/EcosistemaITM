name: CI - Ecosistema ITM Nivel 5

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend API y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore src/GestionITM.API/GestionITM.API.csproj
          dotnet restore tests/GestionITM.Tests/GestionITM.Tests.csproj

      - name: Build API (Release)
        run: dotnet build src/GestionITM.API/GestionITM.API.csproj -c Release --no-restore

      - name: Ejecutar tests
        run: dotnet test tests/GestionITM.Tests/GestionITM.Tests.csproj -c Release --verbosity normal

  maui-android:
    name: App MAUI Android
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Instalar workload MAUI Android
        run: dotnet workload install maui-android

      - name: Build MAUI Android (Release)
        run: dotnet build src/GestionITM.AppMovil/GestionITM.AppMovil.csproj -f net9.0-android -c Release
